<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナルム教の一日</title>
<meta name="description" content="ナルム教の信徒として、目覚めから就寝までの一日を過ごすブラウザゲーム。">
<style>
:root{--bg:#fbf6ea;--ink:#2b2118;--accent:#c0572b;--gold:#d9a441;--card:#fffdf7;--line:#e4d6bd;--good:#3f8f5a;--calm:#6a8fd6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1812;--ink:#f3e9d6;--accent:#f0875a;--gold:#e8b65a;--card:#2a2219;--line:#4a3d2b;--good:#6cc08a;--calm:#8fb0f0}}
:root[data-theme="dark"]{--bg:#1d1812;--ink:#f3e9d6;--accent:#f0875a;--gold:#e8b65a;--card:#2a2219;--line:#4a3d2b;--good:#6cc08a;--calm:#8fb0f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px}
.clock{font-size:20px;font-weight:700;color:var(--accent);min-width:64px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:6px;flex:1 1 140px}
.stat span{white-space:nowrap}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.stat b{min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.panel p{margin:0;line-height:1.8}
h1{margin:6px 0 0;font-size:26px;color:var(--gold)}
.lead,.hint{font-size:13px;opacity:.75}
.scene-title{font-weight:700;color:var(--accent);font-size:16px}
.quote{font-style:italic;color:var(--gold)}
.rank{font-size:20px;font-weight:800;color:var(--gold)}
.btn{font:inherit;font-weight:700;padding:12px 20px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none}
.btn:hover{background:var(--accent);color:#fff}
.btn.big{padding:16px 36px;font-size:18px;background:var(--accent);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--ink)}
.btn.hold{width:100%;max-width:320px;padding:28px;font-size:18px}
.btn.hold.on{background:var(--gold);border-color:var(--gold);color:#2b2118}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice{width:100%}
.scripture{font-size:18px;line-height:2}
.scripture u{text-decoration:none;border-bottom:2px solid var(--gold);padding:0 6px}
.prog{width:100%;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.big-num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.chant-word{font-size:26px;color:var(--gold);min-height:34px;font-weight:700}
.beat-cur{font-size:64px;font-weight:800;min-height:80px;line-height:1.2;color:var(--accent)}
.beat-track{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:14px;opacity:.6}
.beat-track span.now{color:var(--accent);opacity:1;font-weight:800}
.beat-ring{width:90px;height:90px;border-radius:50%;border:4px solid var(--gold);opacity:.4}
.beat-ring.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{transform:scale(1.6);opacity:1}100%{transform:scale(1);opacity:.4}}
.beat-result{min-height:26px;font-weight:700;color:var(--good)}
.track{position:relative;width:100%;height:70px;background:var(--line);border-radius:12px;overflow:hidden}
.zone{position:absolute;left:50%;top:0;bottom:0;width:14%;transform:translateX(-50%);background:rgba(63,143,90,.3)}
.target{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:22px}
.bingo-head,.bingo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.bingo-head div{font-weight:800;color:var(--accent);font-size:20px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums;font-weight:700;background:var(--bg)}
.cell.hit{background:var(--gold);color:#2b2118}
.ball{font-size:28px;font-weight:800;min-height:40px;color:var(--accent)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="scene"></main>
</div>
<script>
// ---------- 基本処理 ----------
const $ = s => document.querySelector(s);
const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
const panel = h => `<section class="panel">${h}</section>`;
const btn = (id, label, cls = '') => `<button id="${id}" class="btn ${cls}">${label}</button>`;
const pick = a => a[Math.floor(Math.random() * a.length)];
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const S = { min: 360, faith: 0, body: 100, calm: 50, goods: [] };
const timers = [];
let raf = 0;
let tapFn = null;

function reset() { Object.assign(S, { min: 360, faith: 0, body: 100, calm: 50, goods: [] }); }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearAll() { timers.splice(0).forEach(clearTimeout); cancelAnimationFrame(raf); raf = 0; tapFn = null; }
function clockText() {
  const t = Math.floor(S.min);
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}
function gain(k, v) { S[k] = Math.max(0, Math.min(100, S[k] + v)); hud(); }

function hud() {
  const stats = [['信仰', S.faith, 'var(--gold)'], ['体力', S.body, 'var(--good)'], ['穏やかさ', S.calm, 'var(--calm)']];
  $('#hud').innerHTML = `<div class="clock">${clockText()}</div>` + stats.map(([n, v, c]) =>
    `<div class="stat"><span>${n}</span><div class="bar"><i style="width:${Math.round(v)}%;background:${c}"></i></div><b>${Math.round(v)}</b></div>`
  ).join('');
}
function show(html) { clearAll(); $('#scene').innerHTML = html; hud(); }
function result(title, lines, label, next) {
  show(panel(`<p class="scene-title">${title}</p>${lines.map(l => `<p>${l}</p>`).join('')}${btn('next', label, 'big')}`));
  on('next', next);
}

// ---------- 0. タイトル ----------
function title() {
  show(panel(`<h1>ナルム教の一日</h1>
    <p class="lead">目が覚めてから眠りにつくまで、ナルム教の信徒として正しく一日を過ごしましょう。</p>
    <p class="hint">朝の合唱 → 3時間の詠唱 → 経典の音読 → 讃美歌カラオケ → 大ビンゴ → 枕投げ → 就寝</p>
    ${btn('start', '目を覚ます', 'big')}`));
  on('start', () => { reset(); wake(); });
}

// ---------- 1. 起床 ----------
function wake() {
  show(panel(`<p class="scene-title">寝室 ・ ${clockText()}</p>
    <p>目が覚めた。枕元では、小さなナルム様の像がこちらを見つめている。</p>
    <p class="quote">「今日も、ナルムの光がありますように」</p>
    ${btn('next', '朝の合唱へ', 'big')}`));
  on('next', choir);
}

// ---------- リズムゲーム（合唱・カラオケ共通） ----------
// 光の輪が鳴るタイミングに合わせて「唱う」を押す。
function rhythm(cfg, done) {
  const n = cfg.lyrics.length, iv = cfg.interval, LEAD = 1000;
  const scored = Array(n).fill(false);
  let perfect = 0, good = 0, over = false, t0 = 0;

  show(panel(`<p class="scene-title">${cfg.title}</p>
    <div id="cur" class="beat-cur">…</div>
    <div id="ring" class="beat-ring"></div>
    <div id="rs" class="beat-result"></div>
    <div class="beat-track">${cfg.lyrics.map(c => `<span>${c}</span>`).join('')}</div>
    <p class="hint">光の輪に合わせて「唱う」（スペースキーでも可）</p>
    ${btn('tap', '唱う！', 'big')}`));

  const cur = $('#cur'), ring = $('#ring'), rs = $('#rs');
  const spans = document.querySelectorAll('.beat-track span');
  t0 = performance.now() + LEAD;

  cfg.lyrics.forEach((_, i) => later(() => {
    cur.textContent = cfg.lyrics[i];
    spans.forEach((s, j) => s.classList.toggle('now', j === i));
    ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
  }, LEAD + i * iv));

  $('#tap').onpointerdown = () => tapFn && tapFn();
  tapFn = () => {
    if (over) return;
    const now = performance.now();
    const k = Math.round((now - t0) / iv);
    if (k < 0 || k >= n || scored[k]) { rs.textContent = '空振り…'; return; }
    const d = Math.abs(now - (t0 + k * iv));
    if (d > 280) { rs.textContent = 'ずれ…'; return; }
    scored[k] = true;
    if (d <= 120) { perfect++; rs.textContent = '完璧！'; } else { good++; rs.textContent = '良い！'; }
  };

  later(() => { over = true; tapFn = null; done({ perfect, good, n }); }, LEAD + (n - 1) * iv + 400);
}

// ---------- 2. 朝の合唱 ----------
const CHOIR = {
  title: '朝の合唱　讃美歌「ナルムの朝」',
  lyrics: ['ナ', 'ル', 'ム', 'の', '朝', 'ま', 'だ', 'き', '光', 'に', '満', 'ち', 'て', 'ナ', 'ル', 'ム'],
  interval: 620
};
function choir() {
  rhythm(CHOIR, r => {
    const ratio = (r.perfect * 2 + r.good) / (r.n * 2);
    gain('faith', r.perfect * 2 + r.good);
    gain('body', -3);
    S.min += 10;
    const msg = ratio >= 0.8 ? '天使の歌声です。ナルム様も涙ぐんでいます。' : ratio >= 0.5 ? 'まずまずの合唱です。' : '音程が少し迷子になりました。';
    result('朝の合唱 終了', [`完璧 ${r.perfect} ・ 良い ${r.good} ・ 全 ${r.n} 拍`, msg], '3時間の詠唱へ', chant);
  });
}

// ---------- 3. アッタチム・タタッチム（3時間） ----------
function chant() {
  const base = S.min;
  let prog = 0, count = 0, holding = false, finished = false, wt = 0, last = performance.now();

  show(panel(`<p class="scene-title">アッタチム・タタッチム詠唱（3時間）</p>
    <div class="prog"><i id="pb"></i></div>
    <p id="ct" class="big-num">経過 0時間00分</p>
    <div id="cw" class="chant-word">…</div>
    <p class="hint">ボタンを押している間だけ唱えられます。離すと休憩。</p>
    <button id="hold" class="btn hold">押し続けて唱える</button>
    <p id="cc" class="hint">唱えた回数 0</p>`));

  const hold = $('#hold');
  const press = () => { if (!finished) { holding = true; hold.classList.add('on'); } };
  const release = () => { holding = false; hold.classList.remove('on'); };
  hold.onpointerdown = press;
  hold.onpointerup = release;
  hold.onpointercancel = release;
  hold.onpointerleave = release;

  const frame = now => {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (holding) {
      const speed = S.body < 30 ? 0.5 : 1; // 喉が枯れてペースが落ちる
      prog = Math.min(100, prog + dt * (100 / 30) * speed);
      S.faith = Math.min(100, S.faith + dt * 2);
      S.body = Math.max(0, S.body - dt);
      wt += dt;
      if (wt >= 0.5) {
        wt -= 0.5; count++;
        $('#cw').textContent = count % 2 ? 'アッタチム' : 'タタッチム';
        $('#cc').textContent = `唱えた回数 ${count}`;
      }
    } else {
      S.body = Math.min(100, S.body + dt * 0.5); // 休むと少し回復
    }
    S.min = base + prog * 1.8;
    $('#pb').style.width = prog + '%';
    const mins = Math.floor(prog * 1.8);
    $('#ct').textContent = `経過 ${Math.floor(mins / 60)}時間${String(mins % 60).padStart(2, '0')}分`;
    hud();

    if (prog >= 100) {
      finished = true;
      result('詠唱完了', ['3時間、アッタチム・タタッチムを唱え続けました。', `唱えた回数 ${count}`], '経典の音読へ', scripture);
      return;
    }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

// ---------- 4. 経典の音読 ----------
const QUIZ = [
  { q: 'はじめに、ナルムは＿＿の上で目覚めた。', c: ['枕', '石畳', '鍋'], a: 0 },
  { q: '声は小さくとも、＿＿は大きく唱えよ。', c: ['財布', '信仰', '肩'], a: 1 },
  { q: '隣の信徒が転んだなら、まず＿＿を差し出せ。', c: ['説教', '手', '領収書'], a: 1 },
  { q: 'ナルム様は、眠る者の＿＿を照らす。', c: ['まぶた', '寝言', '夢'], a: 2 },
  { q: '讃美は歌うことに始まり、＿＿に終わる。', c: ['拍手', '沈黙', '昼寝'], a: 0 }
];
function scripture() {
  let i = 0, ok = 0;
  const ask = () => {
    const Q = QUIZ[i];
    let answered = false;
    show(panel(`<p class="scene-title">経典の音読 ${i + 1}/${QUIZ.length}</p>
      <p class="scripture">${Q.q.replace('＿＿', '<u>＿＿</u>')}</p>
      <div class="choices">${Q.c.map((c, k) => `<button class="btn choice" data-k="${k}">${c}</button>`).join('')}</div>
      <p id="fb" class="beat-result"></p>`));
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (answered) return;
      answered = true;
      if (+b.dataset.k === Q.a) {
        ok++;
        gain('faith', 4);
        $('#fb').textContent = `正解！「${Q.c[Q.a]}」。ナルム様が微笑んだ。`;
      } else {
        gain('calm', -5);
        $('#fb').textContent = `ちがいます。正しくは「${Q.c[Q.a]}」。`;
        $('#fb').style.color = 'var(--accent)';
      }
      document.querySelectorAll('.choice').forEach(x => x.disabled = true);
      $('#scene .panel').insertAdjacentHTML('beforeend', btn('next', i < QUIZ.length - 1 ? '次の一節へ' : '音読を終える', 'big'));
      on('next', () => {
        if (++i < QUIZ.length) { ask(); return; }
        S.min += 30;
        result('経典の音読 終了', [
          `正解 ${ok} / ${QUIZ.length}`,
          ok >= 4 ? 'ナルム様の言葉を、一字一句まちがえずに読み上げました。' : '途中で噛んだ箇所がありましたが、祈りは届いています。'
        ], '讃美歌カラオケ大会へ', karaoke);
      });
    });
  };
  ask();
}

// ---------- 5. 讃美歌カラオケ大会 ----------
const KARAOKE = {
  title: '讃美歌カラオケ大会　「ナルムよ、わが喉を照らせ」',
  lyrics: ['ナ', 'ル', 'ム', 'よ', 'わ', 'が', '喉', 'を', '照', 'ら', 'せ', 'ナ', 'ル', 'ム', 'よ', '喝', '采', '！'],
  interval: 520
};
function karaoke() {
  rhythm(KARAOKE, r => {
    const ratio = (r.perfect * 2 + r.good) / (r.n * 2);
    gain('faith', r.perfect * 1.5 + r.good);
    gain('body', -4);
    S.min += 60;
    let msg;
    if (ratio >= 0.8) { gain('calm', 10); msg = '会場が総立ちになった！ 穏やかさ +10'; }
    else if (ratio >= 0.5) { gain('calm', 4); msg = '会場から大きな拍手が起きました。'; }
    else msg = 'マイクのハウリングで、会場が少し気まずくなった…';
    result('カラオケ大会 終了', [`完璧 ${r.perfect} ・ 良い ${r.good} ・ 全 ${r.n} 拍`, msg], 'ナルム様グッズ大ビンゴへ', bingo);
  });
}

// ---------- 6. ナルム様グッズ大ビンゴ大会 ----------
const PRIZES = ['ナルム様ぬいぐるみ（特大）', 'ナルム様の祈りタオル', '聖水ボトル（500ml）', 'ナルム様カレンダー（来年版）', 'アッタチム饅頭（箱入り）'];
const CONSOLATION = 'ナルム様ステッカー（金）';
function bingo() {
  const LETTERS = 'BINGO';
  const MAX = 40;
  // card[c][r]：列 c（B,I,N,G,O）、行 r。中央は FREE
  const card = [0, 1, 2, 3, 4].map(c => shuffle(range(c * 15 + 1, c * 15 + 15)).slice(0, 5));
  card[2][2] = 0;
  const mk = [0, 1, 2, 3, 4].map(() => Array(5).fill(false));
  mk[2][2] = true;
  const pool = shuffle(range(1, 75));
  let drawn = 0, over = false;

  const hasLine = () => {
    for (let i = 0; i < 5; i++) {
      if (mk[i].every(Boolean)) return true;
      if (mk.every(col => col[i])) return true;
    }
    return [0, 1, 2, 3, 4].every(i => mk[i][i]) || [0, 1, 2, 3, 4].every(i => mk[i][4 - i]);
  };
  const finish = won => {
    over = true;
    S.min += 60;
    gain('body', -5);
    if (won) {
      gain('faith', 10);
      gain('calm', 10);
      const g = pick(PRIZES);
      S.goods.push(g);
      result('大ビンゴ 優勝！', [`ナルム様グッズ「${g}」を獲得しました。`, `抽選 ${drawn} 回目で揃いました。`], '枕投げへ', pillow);
    } else {
      gain('calm', 3);
      S.goods.push(CONSOLATION);
      result('大ビンゴ 終了', [`惜しくも揃いませんでした。参加賞「${CONSOLATION}」を授与されました。`], '枕投げへ', pillow);
    }
  };

  let cells = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    cells += `<div class="cell" id="b${c}${r}">${c === 2 && r === 2 ? '★' : card[c][r]}</div>`;
  }
  show(panel(`<p class="scene-title">ナルム様グッズ大ビンゴ大会</p>
    <div class="bingo-head">${[...LETTERS].map(l => `<div>${l}</div>`).join('')}</div>
    <div class="bingo-grid">${cells}</div>
    <div id="ball" class="ball">抽選前</div>
    <p id="bi" class="hint">抽選は最大 ${MAX} 回</p>
    <div class="row-btns">${btn('draw', '番号を引く', 'big')}${btn('call', 'ビンゴ！')}</div>`));

  on('draw', () => {
    if (over || drawn >= MAX) return;
    const n = pool[drawn++];
    $('#ball').textContent = `${LETTERS[Math.floor((n - 1) / 15)]} ${n}`;
    for (let c = 0; c < 5; c++) for (let r = 0; r < 5; r++) {
      if (card[c][r] === n && !mk[c][r]) { mk[c][r] = true; $(`#b${c}${r}`).classList.add('hit'); }
    }
    $('#bi').textContent = `残り抽選: ${MAX - drawn} 回`;
    if (drawn >= MAX) {
      $('#draw').disabled = true;
      if (!hasLine()) finish(false);
    }
  });
  on('call', () => {
    if (over) return;
    if (hasLine()) { finish(true); return; }
    gain('calm', -5);
    $('#bi').textContent = 'まだ揃っていません…（穏やかさ -5）';
  });
}

// ---------- 7. ナルム式枕投げ ----------
function pillow() {
  let thrown = 0, hits = 0, pos = 0, dir = 1, last = performance.now(), over = false;
  show(panel(`<p class="scene-title">ナルム式枕投げ（全5投）</p>
    <div class="track"><div class="zone"></div><div id="tg" class="target">✨</div></div>
    <p id="pr" class="beat-result">中央の光をめがけて投げよう</p>
    <p class="hint">投げた数 <span id="pc">0</span>/5 ・ 命中 <span id="ph">0</span></p>
    ${btn('throw', '投げる！', 'big')}`));

  const tg = $('#tg');
  const frame = now => {
    if (over) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pos += dir * dt * 0.9;
    if (pos >= 1) { pos = 1; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; }
    tg.style.left = pos * 100 + '%';
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);

  $('#throw').onpointerdown = () => {
    if (over) return;
    const d = Math.abs(pos - 0.5);
    thrown++;
    let msg;
    if (d < 0.07) { hits++; msg = 'ナイス命中！ 光が弾けた'; }
    else if (d < 0.16) msg = 'おしい！';
    else msg = 'はずれ…ナルム様は軽やかに避けた';
    $('#pr').textContent = msg;
    $('#pc').textContent = thrown;
    $('#ph').textContent = hits;
    gain('body', -1);
    if (thrown >= 5) {
      over = true;
      $('#throw').disabled = true;
      later(() => {
        S.min += 30;
        gain('calm', hits * 6);
        result('枕投げ 終了', [
          `命中 ${hits} / 5`,
          hits >= 3 ? 'ナルム式の枕投げで、心が軽くなりました。' : '次こそは、ナルム様の光に届くように。'
        ], '就寝へ', sleep);
      }, 900);
    }
  };
}

// ---------- 8. 就寝 ----------
function sleep() {
  const rank = S.faith >= 80 ? '聖なる信徒' : S.faith >= 50 ? '敬虔なる信徒' : '修行中の信徒';
  const goods = S.goods.length ? S.goods.map(g => `・${g}`).join('<br>') : 'なし';
  show(panel(`<p class="scene-title">就寝 ・ ${clockText()}</p>
    <p>まだ昼ですが、ナルム教徒は枕投げのあとに眠ります。</p>
    <p class="rank">称号：${rank}</p>
    <p>信仰 ${Math.round(S.faith)} ・ 体力 ${Math.round(S.body)} ・ 穏やかさ ${Math.round(S.calm)}</p>
    <p>獲得グッズ<br>${goods}</p>
    <p class="quote">「アッタチム・タタッチム。おやすみなさい。」</p>
    ${btn('again', 'もう一度、最初から', 'big')}`));
  on('again', () => { reset(); title(); });
}

// ---------- 入力 ----------
addEventListener('keydown', e => {
  if (tapFn && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); tapFn(); }
});

title();
</script>
</body>
</html>
